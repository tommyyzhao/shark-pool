# shark-pool
#
# Two country pools (US, UK) — every .ovpn in configs/<country>/ becomes a
# concurrent tunnel with its own HTTP + SOCKS5 port — plus a registry that
# exports paste-ready 9router proxy-pool entries for every location.
#
#   cp .env.example .env   # fill SURFSHARK_* service credentials
#   docker compose up -d --build
#
# US locations: HTTP 8888+  SOCKS 1080+  API :8000
# UK locations: HTTP 8920+  SOCKS 1120+  API :8001
# Registry:     http://127.0.0.1:8100/api/v1/9router/export

x-exit-common: &exit-common
  build: .
  image: shark-pool:local
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  dns:
    - 1.1.1.1
    - 8.8.8.8
  environment: &exit-env
    SURFSHARK_USERNAME: ${SURFSHARK_USERNAME:?set in .env}
    SURFSHARK_PASSWORD: ${SURFSHARK_PASSWORD:?set in .env}
    AUTO_RECONNECT: "true"
    CONNECT_TIMEOUT_SEC: "75"
    HEALTH_INTERVAL_SEC: "30"
    PUBLIC_HOST: "127.0.0.1"
    # 0 = all .ovpn files in the config dir
    MAX_SERVERS: "0"
  sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    - net.ipv4.conf.all.src_valid_mark=1

services:
  us:
    <<: *exit-common
    container_name: shark-us
    ports:
      - "8000:8000"
      # HTTP + SOCKS ranges sized for ~24 US locations
      - "8888-8912:8888-8912"
      - "1080-1104:1080-1104"
    volumes:
      - ./configs/us:/vpn/configs:ro
    environment:
      <<: *exit-env
      EXIT_NAME: us
      VPN_CONFIG_DIR: /vpn/configs
      API_PORT: "8000"
      HTTP_PORT: "8888"
      SOCKS_PORT: "1080"

  uk:
    <<: *exit-common
    container_name: shark-uk
    ports:
      - "8001:8000"
      - "8920-8940:8920-8940"
      - "1120-1140:1120-1140"
    volumes:
      - ./configs/uk:/vpn/configs:ro
    environment:
      <<: *exit-env
      EXIT_NAME: uk
      VPN_CONFIG_DIR: /vpn/configs
      API_PORT: "8000"
      HTTP_PORT: "8920"
      SOCKS_PORT: "1120"

  registry:
    build: .
    image: shark-pool:local
    container_name: shark-registry
    restart: unless-stopped
    depends_on:
      - us
      - uk
    ports:
      - "8100:8100"
    environment:
      SHARK_POOL_MODE: registry
      API_PORT: "8100"
      POLL_INTERVAL_SEC: "10"
      REGISTRY_EXITS: >-
        us|http://us:8000,
        uk|http://uk:8000
